<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sorting Hat · House Draft</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // Apply the saved (or system) theme before first paint to avoid a flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem('sortinghat-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <!-- Web fonts are optional: offline, the app falls back to system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="favicon.svg" alt="">
      <div>
        <h1>Sorting Hat</h1>
        <p>House draft · everything stays in this browser</p>
      </div>
    </div>
    <ol class="stepper" id="stepper" aria-label="Progress">
      <li data-step="files">Select files</li>
      <li data-step="validate">Validate</li>
      <li data-step="generate">Generate</li>
      <li data-step="preview">Preview &amp; edit</li>
      <li data-step="export">Finalize &amp; export</li>
    </ol>
    <button class="btn theme-toggle" id="theme-toggle" type="button"></button>
  </header>

  <main id="app"></main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <dialog id="confirm" class="dialog">
    <form method="dialog">
      <h3 id="confirm-title"></h3>
      <div id="confirm-body"></div>
      <div class="dialog-actions">
        <button value="cancel" class="btn">Cancel</button>
        <button value="ok" class="btn primary" id="confirm-ok">Confirm</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/io.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
