<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Sorting Ceremony</title>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/hall.css">
</head>
<body>
  <main id="hall" class="hall">
    <canvas id="sky" class="sky" aria-hidden="true"></canvas>
    <div class="clouds" aria-hidden="true"></div>
    <div id="banners" class="banners" aria-hidden="true"></div>
    <svg id="garland" class="garland" aria-hidden="true"></svg>
    <div class="tree left" aria-hidden="true"></div>
    <div class="tree right" aria-hidden="true"></div>
    <svg id="tables" class="tables" viewBox="0 0 1600 540" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
    <div id="candles" class="candles" aria-hidden="true"></div>
    <div class="shade" aria-hidden="true"></div>
    <canvas id="snow" class="snow" aria-hidden="true"></canvas>
    <div class="dais">
      <div id="hat" class="hat asleep"></div>
      <svg class="stool" viewBox="0 0 200 120" aria-hidden="true">
        <ellipse cx="100" cy="18" rx="90" ry="14" fill="#5b3a20"/>
        <rect x="10" y="18" width="180" height="12" fill="#3f2714"/>
        <path d="M30 28 L14 118 M100 30 L100 118 M170 28 L186 118" stroke="#3f2714" stroke-width="10" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 id="name" class="name" aria-live="polite"></h1>
    <p id="subtitle" class="subtitle" aria-live="polite"></p>
    <div id="reveal" class="reveal" hidden><div class="reveal-banner"><span></span></div></div>
    <canvas id="sparks" class="sparks" aria-hidden="true"></canvas>
    <form id="picker" class="picker" autocomplete="off">
      <label for="pick">Who shall be sorted next?</label>
      <div class="scroll">
        <ul id="options" class="options" role="listbox" aria-label="Employees" hidden></ul>
        <input id="pick" type="text" role="combobox" aria-controls="options" aria-expanded="false" placeholder="Type a name…" spellcheck="false">
      </div>
    </form>
    <div id="notice" class="notice" hidden><p></p><a href="/prepare">Go to Prepare</a></div>
    <p id="hint" class="hint">Space skip to house · Esc cancel · M mute · R rehearsal (outside the search box)</p>
  </main>
  <script src="/js/sfx.js"></script>
  <script src="/js/voice.js"></script>
  <script src="/js/hat.js"></script>
  <script src="/js/hall.js"></script>
  <script src="/js/reveal.js"></script>
  <script src="/js/subtitles.js"></script>
  <script src="/js/picker.js"></script>
  <script src="/js/ceremony.js"></script>
  <script src="/js/show.js"></script>
</body>
</html>
